name: Run one MCT benchmark cell

on:
  workflow_dispatch:
    inputs:
      observability:
        description: "HMM observability regime"
        required: true
        default: "medium"
        type: choice
        options: [easy, medium, hard]
      seed:
        description: "Canonical or exploratory seed"
        required: true
        default: "7"

jobs:
  run-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Run one frozen-config cell
        run: >-
          python scripts/run_benchmark_suite.py
          --only-observability ${{ inputs.observability }}
          --only-seed ${{ inputs.seed }}
          --force
      - name: Show metrics
        run: |
          cat results/v1/runs/${{ inputs.observability }}_seed*/metrics.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: mct-${{ inputs.observability }}-seed${{ inputs.seed }}
          path: results/v1/runs/${{ inputs.observability }}_seed*/
