artifact_version: 1
protocol_status: frozen_before_confirmatory_evidence
protocol_revision_note: >-
  The original 8000-sequence/8-epoch CPU specification was reduced before the
  final evidence bundle because a single CPU run exceeded the practical
  execution window. The multinomial logistic sampled-state probe was also
  replaced by a deterministic ridge linear classifier because convergence time
  varied sharply across observability regimes. No seed or regime was selected
  based on outcome. Seeds, observability regimes, split policy, hypotheses,
  causal controls, and primary predictive-belief metrics were unchanged. Training
  now stops only after the model-validation loss is within 0.02 nats/token of
  the exact Bayes oracle (after at least six epochs), or at 30 epochs.
run_kind: confirmatory
